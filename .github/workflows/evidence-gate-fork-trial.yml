name: mcp-use fork evidence gate trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-evidence:
    name: Verify ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matching-clean
            receipt: evidence/evidence-gate-trial/pass.json
            expected: pass
          - name: digest-mismatch
            receipt: evidence/evidence-gate-trial/inconclusive.json
            expected: inconclusive
          - name: findings
            receipt: evidence/evidence-gate-trial/fail.json
            expected: fail

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml

      - name: Install TypeScript dependencies
        working-directory: libraries/typescript
        run: pnpm install --frozen-lockfile

      - name: Build mcp-use package
        working-directory: libraries/typescript
        run: pnpm --filter mcp-use build

      - name: Pack mcp-use artifact
        working-directory: libraries/typescript/packages/server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence/evidence-gate-trial"
          mkdir -p "$RUNNER_TEMP/mcp-use-pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/mcp-use-pack"
          cp "$RUNNER_TEMP"/mcp-use-pack/mcp-use-*.tgz "$GITHUB_WORKSPACE/evidence/evidence-gate-trial/mcp-use.tgz"

      - name: Prepare receipts from packed artifact
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          const root = 'evidence/evidence-gate-trial'
          const artifact = `${root}/mcp-use.tgz`
          const digest = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex')
          const scannedAt = new Date().toISOString()
          const base = {
            scanner: 'mcp-use-fork-trial',
            scan_scope: ['package'],
            scanned_at: scannedAt,
            attestation: 'publisher-asserted',
          }
          fs.writeFileSync(`${root}/pass.json`, JSON.stringify({
            ...base,
            scanned_artifact_digest: `sha256:${digest}`,
            verdict: 'clean',
          }, null, 2) + '\n')
          fs.writeFileSync(`${root}/inconclusive.json`, JSON.stringify({
            ...base,
            scanned_artifact_digest: 'sha256:' + '0'.repeat(64),
            verdict: 'clean',
          }, null, 2) + '\n')
          fs.writeFileSync(`${root}/fail.json`, JSON.stringify({
            ...base,
            scanned_artifact_digest: `sha256:${digest}`,
            verdict: 'findings',
          }, null, 2) + '\n')
          console.log(`artifact_sha256=sha256:${digest}`)
          NODE      - name: Verify evidence gate
        id: evidence
        continue-on-error: true
        uses: yandexuanxuan/mcp-evidence-gate@7b1569284e321976b4b61378c223ce6a28fbdb9b
        with:
          receipt: ${{ matrix.receipt }}
          artifact: evidence/evidence-gate-trial/example-artifact.txt
          policy: permissive

      - name: Assert expected decision
        if: always()
        run: |
          echo "decision=${{ steps.evidence.outputs.decision }}"
          echo "receipt-verdict=${{ steps.evidence.outputs.receipt-verdict }}"
          echo "profile=${{ steps.evidence.outputs.profile }}"
          test "${{ steps.evidence.outputs.decision }}" = "${{ matrix.expected }}"